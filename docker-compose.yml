services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"  # hanya localhost; cloudflared di host yang expose ke publik
    environment:
      DATABASE_URL: postgresql+psycopg://finance:${DB_PASSWORD}@db:5432/finance
      SECRET_KEY: ${SECRET_KEY}
      COOKIE_SECURE: "true"
      RP_ID: ${DOMAIN}
      RP_ORIGIN: https://${DOMAIN}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    networks: [internal]

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: finance
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: finance
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finance"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [internal]

networks:
  internal:

volumes:
  pgdata:
