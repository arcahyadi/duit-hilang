<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Finance Tracker{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #1a1a2e; color: #e0e0e0; }
    .card { background: #16213e; border: none; }
    .card-header { background: #0f3460; }
    .navbar { background: #0f3460; }
    a { color: #7ec8ff; }
    .table { color: #e0e0e0; }
  </style>
</head>
<body>
<nav class="navbar navbar-expand-lg">
  <div class="container">
    <a class="navbar-brand text-light" href="/">💰 Finance Tracker</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav"><span class="navbar-toggler-icon"></span></button>
    <div class="collapse navbar-collapse" id="nav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link text-light" href="/">Dashboard</a></li>
        <li class="nav-item"><a class="nav-link text-light" href="/transactions">Transaksi</a></li>
        <li class="nav-item"><a class="nav-link text-light" href="/budgets">Budget</a></li>
        <li class="nav-item"><a class="nav-link text-light" href="/reports">Laporan</a></li>
        <li class="nav-item"><a class="nav-link text-light" href="/export">Export</a></li>
        <li class="nav-item"><a class="nav-link text-light" href="/settings">Settings</a></li>
        {% if user and user.is_admin %}<li class="nav-item"><a class="nav-link text-warning" href="/admin">Admin</a></li>{% endif %}
        <li class="nav-item"><form method="post" action="/auth/logout" class="d-inline"><button class="btn btn-link nav-link text-light">Logout</button></form></li>
      </ul>
    </div>
  </div>
</nav>
<main class="container py-4">
  {% block content %}{% endblock %}
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
