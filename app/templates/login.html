<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login - Finance Tracker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #1a1a2e; color: #e0e0e0; }
    .card { background: #16213e; border: none; max-width: 400px; margin: 10vh auto; }
    .card-header { background: #0f3460; }
  </style>
</head>
<body>
<div class="container">
  <div class="card">
    <div class="card-header text-center text-light">💰 Finance Tracker</div>
    <div class="card-body">
      {% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}
      <form method="post" action="/auth/login">
        <div class="mb-3">
          <label class="form-label">Email</label>
          <input type="email" name="email" class="form-control" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Password</label>
          <input type="password" name="password" class="form-control" required>
        </div>
        <div class="mb-3" id="totp-field" style="display:none">
          <label class="form-label">Kode 2FA (jika diaktifkan)</label>
          <input type="text" name="totp_code" class="form-control" inputmode="numeric" autocomplete="one-time-code">
        </div>
        <button class="btn btn-primary w-100" type="submit">Login</button>
      </form>
      <p class="mt-3 small text-center text-secondary">Login passkey menyusul</p>
    </div>
  </div>
</div>
</body>
</html>
