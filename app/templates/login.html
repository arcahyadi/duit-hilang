<!DOCTYPE html>
<html lang="id" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login - Finance Tracker</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: #151521; min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
    }
    .login-card {
      width: 420px; max-width: 90vw;
      background: #1e1e2d; border: 1px solid #2b2b3d;
      border-radius: 0.75rem; box-shadow: 0 4px 24px rgba(0,0,0,0.3);
    }
    .login-card .brand { text-align: center; padding: 2rem 2rem 1.5rem; }
    .login-card .brand i { font-size: 2.5rem; color: #3699ff; }
    .login-card .brand h4 { margin: 0.5rem 0 0; color: #e4e6ef; font-weight: 600; }
    .login-card .brand p { color: #6d6e80; font-size: 0.85rem; margin-top: 0.25rem; }
    .login-body { padding: 0 2rem 2rem; }
    .form-control, .input-group-text {
      background: #151521; border: 1px solid #2b2b3d;
      color: #e4e6ef; font-size: 0.875rem; padding: 0.55rem 0.75rem;
    }
    .form-control:focus { border-color: #3699ff; box-shadow: 0 0 0 3px rgba(54,153,255,0.1); background: #151521; color: #e4e6ef; }
    .form-control::placeholder { color: #6d6e80; }
    .input-group-text { color: #a2a3b7; }
    .btn-primary { background: #3699ff; border-color: #3699ff; border-radius: 0.5rem; font-weight: 500; padding: 0.55rem; }
    .btn-primary:hover { background: #2684e0; border-color: #2684e0; }
    .alert-danger { background: rgba(246,78,96,0.1); color: #f64e60; border: none; border-radius: 0.5rem; font-size: 0.85rem; }
  </style>
</head>
<body>
<div class="login-card">
  <div class="brand">
    <i class="fa-solid fa-wallet"></i>
    <h4>Finance Tracker</h4>
    <p>Kelola keuangan dengan mudah</p>
  </div>
  <div class="login-body">
    {% if error %}<div class="alert alert-danger py-2">{{ error }}</div>{% endif %}
    <form method="post" action="/auth/login">
      <div class="input-group mb-3">
        <span class="input-group-text"><i class="fa-solid fa-envelope"></i></span>
        <input type="email" name="email" class="form-control" placeholder="Email" required>
      </div>
      <div class="input-group mb-3">
        <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
        <input type="password" name="password" class="form-control" placeholder="Password" required>
      </div>
      <div class="input-group mb-3" id="totp-field" style="display:none">
        <span class="input-group-text"><i class="fa-solid fa-shield-halved"></i></span>
        <input type="text" name="totp_code" class="form-control" placeholder="Kode 2FA" inputmode="numeric" autocomplete="one-time-code">
      </div>
      <button type="submit" class="btn btn-primary w-100">Login</button>
    </form>
  </div>
</div>
</body>
</html>
