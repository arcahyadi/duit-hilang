<!DOCTYPE html>
<html lang="id" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login - Finance Tracker</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/admin-lte@4.0.0-beta3/dist/css/adminlte.min.css">
  <style>body { min-height: 100vh; display: flex; align-items: center; justify-content: center; }</style>
</head>
<body class="bg-body-tertiary">
<div class="card login-card" style="width: 400px;">
  <div class="card-body login-card-body">
    <h5 class="text-center mb-4"><i class="fa-solid fa-wallet"></i> Finance Tracker</h5>
    {% if error %}<div class="alert alert-danger py-2">{{ error }}</div>{% endif %}
    <form method="post" action="/auth/login">
      <div class="input-group mb-3">
        <span class="input-group-text"><i class="fa-solid fa-envelope"></i></span>
        <input type="email" name="email" class="form-control" placeholder="Email" required>
      </div>
      <div class="input-group mb-3">
        <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
        <input type="password" name="password" class="form-control" placeholder="Password" required>
      </div>
      <div class="input-group mb-3" id="totp-field" style="display:none">
        <span class="input-group-text"><i class="fa-solid fa-shield-halved"></i></span>
        <input type="text" name="totp_code" class="form-control" placeholder="Kode 2FA" inputmode="numeric" autocomplete="one-time-code">
      </div>
      <button type="submit" class="btn btn-primary w-100">Login</button>
    </form>
  </div>
</div>
</body>
</html>
